<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Background circle dark charcoal -->
  <circle cx="128" cy="128" r="124" fill="#121212" />
  
  <!-- Outer gold ring -->
  <circle cx="128" cy="128" r="114" stroke="#C5A043" stroke-width="4" fill="none" />
  
  <!-- Ticks ring (radial dashes) -->
  <circle cx="128" cy="128" r="105" stroke="#C5A043" stroke-width="12" stroke-dasharray="3 4" fill="none" />
  
  <!-- Inner gold ring -->
  <circle cx="128" cy="128" r="96" stroke="#C5A043" stroke-width="4" fill="none" />
  
  <!-- Center Monogram -->
  <g fill="#C5A043">
    <!-- N: left vertical bar -->
    <rect x="71" y="75" width="12" height="106" rx="1" />
    
    <!-- N: diagonal bar -->
    <polygon points="71,75 83,75 117,160 117,181 105,181" />
    
    <!-- Elevator Left Rail -->
    <rect x="117" y="75" width="4" height="106" rx="0.5" />
    
    <!-- Elevator Right Rail -->
    <rect x="149" y="75" width="4" height="106" rx="0.5" />
    
    <!-- E: top branch -->
    <rect x="153" y="75" width="32" height="12" rx="1" />
    
    <!-- E: middle branch -->
    <rect x="153" y="122" width="24" height="12" rx="1" />
    
    <!-- E: bottom branch -->
    <rect x="153" y="169" width="32" height="12" rx="1" />
  </g>
  
  <!-- Elevator Door details -->
  <!-- Outline -->
  <rect x="121" y="87" width="28" height="94" stroke="#C5A043" stroke-width="3" fill="none" />
  <!-- Center split line -->
  <line x1="135" y1="87" x2="135" y2="181" stroke="#C5A043" stroke-width="2" />
  <!-- Top indicator display box -->
  <rect x="128" y="77" width="14" height="8" stroke="#C5A043" stroke-width="2" fill="none" />
  <!-- Upward arrow indicator inside display box -->
  <path d="M135 83 L135 79 L133 81 M135 79 L137 81" stroke="#C5A043" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Horizontal door panel groove lines -->
  <line x1="121" y1="134" x2="149" y2="134" stroke="#C5A043" stroke-width="1.5" />
  <line x1="121" y1="138" x2="149" y2="138" stroke="#C5A043" stroke-width="1.5" />
  <line x1="121" y1="172" x2="149" y2="172" stroke="#C5A043" stroke-width="1.5" />
</svg>
